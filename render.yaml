# ============================================================
# Render Blueprint — one-click deploy
# Deploy: https://render.com/deploy?repo=<your-github-repo-url>
# Plan: free tier (Web Service) — sleeps after 15 min idle;
#        keep-alive pings + healthcheck below are included;
#        for true 24/7 use the Starter plan ($7/mo).
# ============================================================
services:
  - type: web
    name: whatsapp-media-bot
    runtime: node
    plan: free            # change to 'starter' for guaranteed 24/7
    # ffmpeg-static is bundled via npm deps (no system install needed);
    # install-ffmpeg.sh is best-effort and never fails the build.
    buildCommand: bash scripts/stamp-build.sh && bash scripts/install-ffmpeg.sh || true && npm ci --omit=dev --no-audit --no-fund
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # NOTE: do NOT set PORT — Render injects its own PORT and routes
      # traffic to it. The app binds process.env.PORT (config default 3000).
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false        # Render prompts the person deploying to set a strong one
      - key: ADMIN_TOKEN
        generateValue: true
      # Country code for pairing-code phone normalization.
      # Nigeria = 234 (07074455500 -> 2347074455500). Set to your country
      # code so national-format numbers work in the pairing flow.
      - key: DEFAULT_COUNTRY_CODE
        value: "234"
      - key: BOT_NAME
        value: WhatsApp Media Bot
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: DEFAULT_QUALITY
        value: "720"
      - key: CLEANUP_AFTER_MINUTES
        value: "120"
      - key: KEEPALIVE_INTERVAL_SEC
        value: "300"
      - key: WEBHOOK_ENABLED
        value: "false"